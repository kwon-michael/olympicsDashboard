<!--
  The tab icon. `/` is the arcade front door now, so the mark is the one in its
  header: the runner sprite from src/components/v2/pixel-icons.tsx, in void on a
  signal square, with the corners left square like everything else on that site.

  Same subject as the icon it replaced — a figure mid-stride — redrawn on the
  9x9 grid it is drawn on everywhere else. The old one was a coral rounded
  square with a curved, anti-aliased runner in it, which is the 2026 site's
  language and reads as a different decade next to a bitmap face.

  The grid, one row per line, `#` lit:

      .....##..
      .....##..
      ..#####..
      .##..##..
      ....##...
      ...####..
      ..##..##.
      .##....##
      ##.......

  One unit of margin all round, so the figure isn't flush against the edge at
  16px. Runs are merged along each row, which is why some rects are wider than
  one unit; `crispEdges` keeps the renderer from smoothing them on the way up.
-->
<svg
  xmlns="http://www.w3.org/2000/svg"
  width="32"
  height="32"
  viewBox="0 0 11 11"
  shape-rendering="crispEdges"
>
  <rect width="11" height="11" fill="#16BA9F" />
  <g transform="translate(1 1)" fill="#050505">
    <rect x="5" y="0" width="2" height="1" />
    <rect x="5" y="1" width="2" height="1" />
    <rect x="2" y="2" width="5" height="1" />
    <rect x="1" y="3" width="2" height="1" />
    <rect x="5" y="3" width="2" height="1" />
    <rect x="4" y="4" width="2" height="1" />
    <rect x="3" y="5" width="4" height="1" />
    <rect x="2" y="6" width="2" height="1" />
    <rect x="6" y="6" width="2" height="1" />
    <rect x="1" y="7" width="2" height="1" />
    <rect x="7" y="7" width="2" height="1" />
    <rect x="0" y="8" width="2" height="1" />
  </g>
</svg>
